<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>protean</title>
    <link rel="stylesheet" href="/molstar.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #app { position: absolute; inset: 0; }
      #status {
        position: fixed; bottom: 8px; right: 8px; z-index: 100;
        font: 12px/1.4 sans-serif; color: #fff; padding: 3px 10px;
        border-radius: 10px; background: #b33; opacity: 0.85;
        pointer-events: none;
      }
      #status.connected { background: #2a7; }
      /* The right-edge slice: Mol*'s left region collapses to a 32px rail on
         its own, and its right region cannot, so this is the same affordance
         supplied by hand. Kept narrow and quiet — it is a door, not a control. */
      #panel-tab {
        position: fixed; top: 50%; right: 0; transform: translateY(-50%);
        z-index: 90; width: 16px; height: 72px; padding: 0; border: 0;
        border-radius: 4px 0 0 4px; cursor: pointer;
        background: rgba(0, 0, 0, 0.22); color: #fff;
        font: 13px/1 sans-serif; opacity: 0.8;
      }
      #panel-tab:hover { background: rgba(0, 0, 0, 0.42); opacity: 1; }
      /* The view menu borrows the tab's palette exactly. A control that asks
         the server is new; a second visual language for it is not wanted.

         Sat above Mol*'s axis widget rather than beside it. That widget is
         drawn into the canvas at `location: bottom-left`, so it does not exist
         in the DOM and cannot be measured from here — and Mol* leaves it out
         of the image pass, so a screenshot does not show it either. This
         clearance is therefore judged rather than measured. */
      #view-menu-button {
        position: fixed; left: 40px; bottom: 104px;
        z-index: 90; padding: 4px 10px; border: 0; border-radius: 4px;
        cursor: pointer; background: rgba(0, 0, 0, 0.22); color: #fff;
        font: 13px/1 sans-serif; opacity: 0.8;
      }
      #view-menu-button:hover { background: rgba(0, 0, 0, 0.42); opacity: 1; }
      /* Opens upward: it is anchored near the bottom of the window, and a menu
         that grew downward would run off the edge. */
      #view-menu {
        position: fixed; left: 40px; bottom: 136px; z-index: 95;
        min-width: 150px; padding: 4px; border-radius: 6px;
        background: rgba(16, 16, 18, 0.92); color: #fff;
        font: 13px/1.5 sans-serif;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      #view-menu[hidden] { display: none; }
      .view-menu-heading {
        padding: 4px 8px 2px; font-size: 11px; letter-spacing: 0.04em;
        text-transform: uppercase; opacity: 0.55;
      }
      .view-menu-item {
        display: block; width: 100%; text-align: left;
        padding: 4px 8px; border: 0; border-radius: 4px;
        background: transparent; color: inherit; font: inherit;
        cursor: pointer;
      }
      .view-menu-item:hover { background: rgba(255, 255, 255, 0.12); }
      .view-menu-item:disabled { cursor: default; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">disconnected</div>
    <!-- Must precede molstar.js: Mol* captures window.requestAnimationFrame at
         module-eval time, so the hidden-tab pump has to be installed first. -->
    <script src="/raf-pump.js"></script>
    <script src="/molstar.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
