name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  viewer:
    name: viewer types and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: vitest
        run: npm test
      - name: build
        run: npm run build

  differential:
    name: selection differential (real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: chrome sanity check
        run: |
          echo "path: ${{ steps.chrome.outputs.chrome-path }}"
          "${{ steps.chrome.outputs.chrome-path }}" --version
      - name: build viewer
        # The differential suite serves the built app from
        # src/protean_mcp/static, so this has to run before pytest.
        run: npm ci && npm run build
        working-directory: viewer
      - run: uv sync --all-extras --dev
      - name: differential tests
        env:
          PROTEAN_DIFFERENTIAL: "1"
          PROTEAN_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Headless needs software WebGL; Mol* will not build a representation
          # without a working GL context.
          PROTEAN_CHROME_FLAGS: >-
            --headless=new --no-sandbox --disable-dev-shm-usage
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
        # The whole suite, not a named list. Two reasons, both learned here:
        #
        # A list silently excludes any new browser suite until someone
        # remembers to add it. That happened — PR 53's twenty centroid tests
        # sat unexecuted behind three green ticks until the omission was
        # spotted, and only because the suite was also run locally.
        #
        # And a list means files never meet, so nothing *between* them is
        # tested. The fast job runs without the gate, so gated files skip
        # there; this job ran five named files, so test_server.py never ran
        # beside them. Backlog item 12 lived on main inside exactly that gap:
        # two refusals that fail only when a gated file runs first, which no CI
        # job ever did. It reproduced only in a local full run.
        #
        # Priced before adopting: the fast tests are ~8 s against this job's
        # ~690 s, so about 1.3% more. The cost is that they now run in both
        # jobs; the benefit is that a cross-file interaction has somewhere to
        # show up.
        run: uv run pytest tests/ -q
