name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  viewer:
    name: viewer types and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: vitest
        run: npm test
      - name: build
        run: npm run build

  # Does this change touch anything the browser job could possibly be affected
  # by? Its own step, so the answer is visible in the log rather than inferred
  # from a job that did or did not appear.
  #
  # Hand-rolled rather than a changed-files action, and not for purity: this is
  # the exact class of action that was compromised in the tj-actions incident,
  # and a `git diff` is ten seconds with no third party in the trust path.
  #
  # It fails loudly if the diff cannot be computed, rather than defaulting to
  # "nothing changed" — a filter that silently answers "skip" is the same shape
  # as every other silent success this project keeps finding.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: what
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "cannot resolve a base to diff against; assuming code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown only"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  differential:
    name: selection differential (real browser)
    runs-on: ubuntu-latest
    # Skipped for markdown-only changes. **Safe because the `python` job is the
    # backstop, not because markdown is inert**: that job runs the whole suite
    # unfiltered, so `test_packaging.py` — which builds a real wheel and so
    # reads README.md — and `test_gitignore.py` still run. Filtering anything
    # beyond `*.md` would need that argument made again, file by file.
    #
    # `needs` + `if` rather than a workflow-level `paths` filter, deliberately:
    # a skipped job still *reports*, and a workflow that never runs never
    # reports at all. `main` is unprotected today, so nothing blocks either
    # way — but the day it gains a required check, the second form leaves every
    # docs PR waiting forever on a status that will never arrive.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: chrome sanity check
        run: |
          echo "path: ${{ steps.chrome.outputs.chrome-path }}"
          "${{ steps.chrome.outputs.chrome-path }}" --version
      - name: build viewer
        # The differential suite serves the built app from
        # src/protean_mcp/static, so this has to run before pytest.
        run: npm ci && npm run build
        working-directory: viewer
      - run: uv sync --all-extras --dev
      - name: differential tests
        env:
          PROTEAN_DIFFERENTIAL: "1"
          PROTEAN_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Headless needs software WebGL; Mol* will not build a representation
          # without a working GL context.
          PROTEAN_CHROME_FLAGS: >-
            --headless=new --no-sandbox --disable-dev-shm-usage
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
        # The whole suite, not a named list. Two reasons, both learned here:
        #
        # A list silently excludes any new browser suite until someone
        # remembers to add it. That happened — PR 53's twenty centroid tests
        # sat unexecuted behind three green ticks until the omission was
        # spotted, and only because the suite was also run locally.
        #
        # And a list means files never meet, so nothing *between* them is
        # tested. The fast job runs without the gate, so gated files skip
        # there; this job ran five named files, so test_server.py never ran
        # beside them. Backlog item 12 lived on main inside exactly that gap:
        # two refusals that fail only when a gated file runs first, which no CI
        # job ever did. It reproduced only in a local full run.
        #
        # Priced before adopting: the fast tests are ~8 s against this job's
        # ~690 s, so about 1.3% more. The cost is that they now run in both
        # jobs; the benefit is that a cross-file interaction has somewhere to
        # show up.
        #
        # `-rs` because a skip is how coverage disappears quietly here. Several
        # of these tests skip on what the renderer turns out to manage, and `-q`
        # alone prints a count with no reasons — so a test can stop running and
        # the tick stays green. That happened: the journal-figure captures, this
        # project's Phase 4 exit criterion, were skipping on the CI renderer,
        # and the only trace was the skip count moving 31 -> 28 on the run where
        # they started executing again. Runtime is unchanged; this just makes
        # the absence legible.
        # `--durations` because every estimate anyone has made about this job
        # has been wrong, in both directions and by a lot.
        #
        # Backlog 24 attributed a 15 -> 33 min step to three journal captures.
        # A later plan attributed the job's cost to browser setup and put it at
        # 18-46 min of it. Both were reasoning from parts. Neither noticed that
        # the 33 min regime ended on 2026-08-17 with *more* tests running, or
        # that the real doubling arrived with Mol* 5.11 (backlog 40): 1140
        # tests in 23m12s became 1139 in 48m18s across one commit.
        #
        # A per-test distribution costs nothing, ships in the log, and settles
        # arguments that have so far been settled by whoever measured last.
        run: uv run pytest tests/ -q -rs --durations=25
