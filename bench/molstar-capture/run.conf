# What the next push to a `molstar-bench/**` branch will measure.
#
# This file is the run's parameters *and* its record: each measurement is a
# commit, so the table in the job summary can always be traced back to the
# settings that produced it. Workflow-dispatch inputs override everything here.
#
# ---------------------------------------------------------------------------
# Step 0 — the falsification gate. Do not bisect until this passes.
#
# 4.18.0 and 5.11.0, twice each, interleaved. Interleaved rather than grouped
# because a runner that drifts over a long job would otherwise put all of the
# drift into the second version and hand back a ratio that is half thermal.
#
# The gate has to show roughly the 2.08x the real job showed. If it does not,
# this benchmark is measuring the wrong thing and bisecting it would name a
# release for no reason.
#
# Two sample levels, because they answer different questions. A regression in
# the cost of each *sample* holds the same ratio at level 4 and level 1. A
# regression in fixed per-capture work — a pass rebuilt, a program relinked once
# per capture — is a roughly constant number of milliseconds, so its ratio falls
# as the level rises. Which one this is decides both where to look in Mol* and
# whether the nineteen-release sweep can be run at the cheap level.
# ---------------------------------------------------------------------------

versions=4.18.0,5.11.0,4.18.0,5.11.0
levels=4,1
repeats=6
warmup=2
size=800x600
fullpath=2
baseline=4.18.0

# ---------------------------------------------------------------------------
# The sweep — all nineteen releases, in order, on one runner.
#
# Appended rather than replacing the gate above: the workflow reads the LAST
# matching line, so this file keeps every run it has driven, in order, and the
# job summary can always be traced back to the settings that produced it.
#
# There is no bisection here. Nineteen runs at about two minutes each is under
# an hour on a free standard runner, and the whole curve is worth more than the
# one release a binary search would return: it shows whether the cost arrived in
# one step or crept, and it prices every release for anyone who reads this later.
#
# It carries its own gate. 4.18.0 is measured first AND last, so the same run
# that names a release also shows what the runner drifted by while doing it —
# and if the 4.18.0-to-5.11.0 ratio inside this table is not roughly the 2x the
# real job showed, nothing else in it means anything and the table is discarded.
#
# 5.1.0/5.1.1/5.1.2 and 5.10.0/5.10.1 are kept even though their render paths are
# byte-identical. That is the point: identical code measured three times is this
# benchmark's noise floor, read off the same runner in the same job as the
# signal, rather than assumed.
#
# repeats drops to 4 because the levels are the expensive part and nineteen
# versions of eight captures each would be two hours; fullpath drops to 0
# because two versions have already shown that the full path tracks the direct
# one, and repeating that nineteen times buys nothing.
# ---------------------------------------------------------------------------

versions=4.18.0,5.0.0,5.1.0,5.1.1,5.1.2,5.2.0,5.3.0,5.4.0,5.4.1,5.4.2,5.5.0,5.6.0,5.6.1,5.7.0,5.8.0,5.9.0,5.10.0,5.10.1,5.11.0,4.18.0
levels=4,1
repeats=4
warmup=1
size=800x600
fullpath=0
baseline=4.18.0

# ---------------------------------------------------------------------------
# The confirmation — the same versions with the occlusion pass switched off.
#
# The sweep put the whole step at 5.4.2, and locally the gap collapses when
# occlusion is off: 5.4.1 710 ms / 5.4.2 1289 ms with it on, 160 ms / 174 ms
# with it off. This run is that result taken on CI, where the numbers count.
#
# The prediction being tested is falsifiable and specific: with occlusion off,
# all four versions should cost the same. If 5.4.2 is still expensive here then
# the occlusion pass is not the whole story and the diagnosis is wrong.
#
# 5.4.1 and 5.4.2 are the pair that matters; 4.18.0 and 5.11.0 are the ends of
# the range, so the row that would still be slow is visible if there is one.
# ---------------------------------------------------------------------------

versions=4.18.0,5.4.1,5.4.2,5.11.0
levels=4,1
repeats=4
warmup=1
size=800x600
fullpath=0
postprocessing=no-occlusion
baseline=4.18.0

# ---------------------------------------------------------------------------
# The second regression — 5.6.0, 1.15x, named from a diff and never measured.
#
# Item 40's adversarial pass found this step after the fact and attributed it to
# `ssao.frag`, whose per-sample bounds clamp became an `isOutsideBounds()` test
# with a `continue`. That attribution is a *reading*, and this project has a
# written rule about readings: the size of a diff carries no information about
# its cost. A static diff already said 5.0.0 once, and 5.0.0 is 1.03x.
#
# Four files change in the capture path between 5.5.0 and 5.6.0, not one:
#
#   ssao.frag      the per-sample bounds test, plus a new isBackground() guard
#                  on the opaque sample and a per-level divisor
#   ssao.js        the SSAO kernel is now blue-noise distributed, where it was
#                  256 Math.random() hemisphere vectors — a different sample
#                  distribution reaches different depth texels
#   outlines.frag  a new "lazy curvature veto", eight extra depth reads per pixel
#   canvas3d.js    the draw loop's fence-sync throttle removed
#
# `outline` defaults to 'off' and this benchmark does not turn it on, so the
# third is not exercised here — checked in that release's postprocessing params,
# not assumed. The other three are all live, and only one of them has been named.
#
# Two questions, and they are not the same question.
#
# ---- (a) which file, in stock Mol* ----------------------------------------
#
# Transplant the shader instead of arguing about it, in both directions:
#
#   5.6.0:ssao.frag=5.5.0   5.6.0 carrying its predecessor's occlusion shader.
#                           If the step is GONE, nothing else in the release
#                           contributes to it.
#   5.5.0:ssao.frag=5.6.0   5.5.0 carrying its successor's. If the step
#                           APPEARS, that shader is sufficient on its own.
#
# Either alone is an elimination; the pair is a double dissociation. If the step
# survives the revert, the answer is in `ssao.js`'s new sample distribution or
# `canvas3d.js`'s fence, and neither can be reached with a shader splice — that
# is the next instrument, not this one.
#
# ---- (b) what it costs PROTEAN, which ships the backlog-40 repair -----------
#
# protean does not run stock Mol*. It carries the `isBackground` fix, which
# restores the early return in front of the sample loop, and that changes the
# population the loop runs over from every texel of the frame to the covered
# fraction of it. A per-sample overhead is not the same share of a capture in
# those two regimes.
#
# Item 40 currently reads the sweep's 15.2% step and the patched build's 15.4%
# residual agreeing as confirmation that the patch removes none of the 5.6.0
# cost. Those two numbers come from the two different regimes above. The
# agreement is only meaningful if the loop is the same share of a capture in
# both — and after the patch it plainly is not, or the patch would have bought
# far more than the 2.72x it did. So measure it:
#
#   5.6.0:ssao.frag=@candidates/ssao-5.6.0-bgfix.frag:ssao-blur.frag=@candidates/ssao-blur-bgfix.frag
#   5.6.0:ssao.frag=@candidates/ssao-5.5.0-bgfix.frag:ssao-blur.frag=@candidates/ssao-blur-bgfix.frag
#
# One bundle, one release, everything else identical; the two rows differ only
# in whose loop body they carry, and both have the early return working. The
# ratio between them is the 5.6.0 shader's cost in the regime protean ships —
# the number that decides whether protean should carry a second patch or leave
# this upstream.
#
# ---- ordering ---------------------------------------------------------------
#
# Twelve rows: every condition twice, the second six mirroring the first six, so
# that linear drift over the job cancels in each condition's pair mean instead
# of landing on whichever condition ran late. 5.5.0 first and last is this run's
# own noise floor — the same build twice, read off the same runner as the
# signal, which is what let item 40's 2.91x be believed.
#
# Two bundles are fetched, not twelve; a transplant costs a string splice.
#
# ---- what run 33252777716 measured, which was not this -----------------------
#
# The first attempt at this block ran every one of its twelve rows with the
# occlusion pass OFF, to answer a question about a regression that lives inside
# the occlusion pass. The block does not set `postprocessing`, and the workflow
# resolved it by reading the last matching line in the FILE — which was the
# `postprocessing=no-occlusion` in the confirmation block above, three
# experiments older.
#
# It produced a clean table. Twelve rows, all within 10% of each other, no
# pattern by condition; it looked like a null result and it was a null
# instrument. What caught it was the job echoing the settings it had settled on,
# and the numbers being ten times smaller than the sweep's.
#
# The resolution is Python now (`resolve_conf.py`, `tests/test_resolve_conf.py`):
# a block is self-contained, anything it does not say takes the documented
# default rather than a neighbour's value, and every setting is logged with the
# line it came from. This block is deliberately left NOT setting
# `postprocessing`, so the re-run exercises that fix rather than papering over
# it with an explicit line.
#
# The occlusion-off rows were not wasted. Read as a control they say the
# transplant machinery itself costs nothing, and run 33252837938 — 5.5.0 and
# 5.6.0 twice each with the pass off, mirrored — puts the two versions at 0.99x.
# So the 5.6.0 step is inside the occlusion pass, which is what rules out
# `canvas3d.js`'s removed fence and `outlines.frag`.
# ---------------------------------------------------------------------------

versions=5.5.0,5.6.0,5.6.0:ssao.frag=5.5.0,5.5.0:ssao.frag=5.6.0,5.6.0:ssao.frag=@bench/molstar-capture/candidates/ssao-5.6.0-bgfix.frag:ssao-blur.frag=@bench/molstar-capture/candidates/ssao-blur-bgfix.frag,5.6.0:ssao.frag=@bench/molstar-capture/candidates/ssao-5.5.0-bgfix.frag:ssao-blur.frag=@bench/molstar-capture/candidates/ssao-blur-bgfix.frag,5.6.0:ssao.frag=@bench/molstar-capture/candidates/ssao-5.5.0-bgfix.frag:ssao-blur.frag=@bench/molstar-capture/candidates/ssao-blur-bgfix.frag,5.6.0:ssao.frag=@bench/molstar-capture/candidates/ssao-5.6.0-bgfix.frag:ssao-blur.frag=@bench/molstar-capture/candidates/ssao-blur-bgfix.frag,5.5.0:ssao.frag=5.6.0,5.6.0:ssao.frag=5.5.0,5.6.0,5.5.0
levels=4,1
repeats=4
warmup=1
size=800x600
fullpath=0
baseline=5.5.0

# ---------------------------------------------------------------------------
# Four runs that answered item 43 were DISPATCHED rather than pushed, so their
# settings live in the Actions log rather than in a commit. Recorded here so
# that this file remains what it claims to be — the record of what was measured
# — and so the next person does not have to reconstruct them from run ids.
#
# `gh workflow run` with no -f sends the YAML's declared defaults, which are not
# empty, so a dispatch overrides this file entirely rather than deferring to it.
# That is why each of these had to name every setting. All four ran with
# levels=4,1 repeats=4 warmup=1 size=800x600 fullpath=0 postprocessing=default
# baseline=5.5.0, mirrored so that drift cancels in the pair means, and are read
# with `read_pairs.py`.
#
#   33252837938  the occlusion-off control (postprocessing=no-occlusion)
#                5.5.0,5.6.0,5.6.0,5.5.0
#                -> 0.99x. Weak on its own: its two 5.5.0 rows are 22% apart,
#                   which is wider than the effect. Superseded by the row below
#                   that reverts only the shader with occlusion ON.
#
#   33253540188  the transplant, both directions, plus protean's regime
#                (this file's block above, pushed, 12 rows)
#                -> the step is 1.160x; 5.5.0 carrying 5.6.0's shader is 1.173x
#
#   33254381944  the blue-noise selection, intervened on
#                5.5.0,5.6.0,5.6.0:candidates-1,5.6.0:ssao.frag=5.5.0,
#                5.6.0:ssao.frag=5.5.0:candidates-1, then mirrored
#                -> reverting the shader alone reads 1.004x, which is what
#                   rules out ssao.js, canvas3d.js and outlines.frag at once
#
#   33254959165  which upstream commit, inside the shader
#                5.5.0,5.6.0,5.6.0:ssao.frag=@candidates/ssao-5.6.0-no-bounds-skip.frag,
#                5.6.0:ssao.frag=@candidates/ssao-5.6.0-no-bg-guard.frag, then mirrored
#                -> the bounds skip is 1.179x, the isBackground guard 1.028x
#
#   33256728440  the divisor, and a first repair
#                5.5.0,5.6.0,5.6.0:ssao.frag=@candidates/ssao-5.6.0-pre-1741.frag,
#                5.6.0:ssao.frag=@candidates/ssao-5.6.0-branchless.frag, then mirrored
#                -> the divisor is not the cost; the repair is SLOWER than stock
#
#   33257901713  the 2x2: predicate form against control flow
#                5.5.0,5.6.0,5.6.0:ssao.frag=@candidates/ssao-5.6.0-flat-predicate.frag,
#                5.6.0:ssao.frag=@candidates/ssao-5.6.0-flat-and-masked.frag,
#                5.6.0:ssao.frag=@candidates/ssao-5.6.0-branchless.frag, then mirrored
# ---------------------------------------------------------------------------
