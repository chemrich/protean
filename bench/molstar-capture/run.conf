# What the next push to a `molstar-bench/**` branch will measure.
#
# This file is the run's parameters *and* its record: each measurement is a
# commit, so the table in the job summary can always be traced back to the
# settings that produced it. Workflow-dispatch inputs override everything here.
#
# ---------------------------------------------------------------------------
# Step 0 — the falsification gate. Do not bisect until this passes.
#
# 4.18.0 and 5.11.0, twice each, interleaved. Interleaved rather than grouped
# because a runner that drifts over a long job would otherwise put all of the
# drift into the second version and hand back a ratio that is half thermal.
#
# The gate has to show roughly the 2.08x the real job showed. If it does not,
# this benchmark is measuring the wrong thing and bisecting it would name a
# release for no reason.
#
# Two sample levels, because they answer different questions. A regression in
# the cost of each *sample* holds the same ratio at level 4 and level 1. A
# regression in fixed per-capture work — a pass rebuilt, a program relinked once
# per capture — is a roughly constant number of milliseconds, so its ratio falls
# as the level rises. Which one this is decides both where to look in Mol* and
# whether the nineteen-release sweep can be run at the cheap level.
# ---------------------------------------------------------------------------

versions=4.18.0,5.11.0,4.18.0,5.11.0
levels=4,1
repeats=6
warmup=2
size=800x600
fullpath=2
baseline=4.18.0

# ---------------------------------------------------------------------------
# The sweep — all nineteen releases, in order, on one runner.
#
# Appended rather than replacing the gate above: the workflow reads the LAST
# matching line, so this file keeps every run it has driven, in order, and the
# job summary can always be traced back to the settings that produced it.
#
# There is no bisection here. Nineteen runs at about two minutes each is under
# an hour on a free standard runner, and the whole curve is worth more than the
# one release a binary search would return: it shows whether the cost arrived in
# one step or crept, and it prices every release for anyone who reads this later.
#
# It carries its own gate. 4.18.0 is measured first AND last, so the same run
# that names a release also shows what the runner drifted by while doing it —
# and if the 4.18.0-to-5.11.0 ratio inside this table is not roughly the 2x the
# real job showed, nothing else in it means anything and the table is discarded.
#
# 5.1.0/5.1.1/5.1.2 and 5.10.0/5.10.1 are kept even though their render paths are
# byte-identical. That is the point: identical code measured three times is this
# benchmark's noise floor, read off the same runner in the same job as the
# signal, rather than assumed.
#
# repeats drops to 4 because the levels are the expensive part and nineteen
# versions of eight captures each would be two hours; fullpath drops to 0
# because two versions have already shown that the full path tracks the direct
# one, and repeating that nineteen times buys nothing.
# ---------------------------------------------------------------------------

versions=4.18.0,5.0.0,5.1.0,5.1.1,5.1.2,5.2.0,5.3.0,5.4.0,5.4.1,5.4.2,5.5.0,5.6.0,5.6.1,5.7.0,5.8.0,5.9.0,5.10.0,5.10.1,5.11.0,4.18.0
levels=4,1
repeats=4
warmup=1
size=800x600
fullpath=0
baseline=4.18.0

# ---------------------------------------------------------------------------
# The confirmation — the same versions with the occlusion pass switched off.
#
# The sweep put the whole step at 5.4.2, and locally the gap collapses when
# occlusion is off: 5.4.1 710 ms / 5.4.2 1289 ms with it on, 160 ms / 174 ms
# with it off. This run is that result taken on CI, where the numbers count.
#
# The prediction being tested is falsifiable and specific: with occlusion off,
# all four versions should cost the same. If 5.4.2 is still expensive here then
# the occlusion pass is not the whole story and the diagnosis is wrong.
#
# 5.4.1 and 5.4.2 are the pair that matters; 4.18.0 and 5.11.0 are the ends of
# the range, so the row that would still be slow is visible if there is one.
# ---------------------------------------------------------------------------

versions=4.18.0,5.4.1,5.4.2,5.11.0
levels=4,1
repeats=4
warmup=1
size=800x600
fullpath=0
postprocessing=no-occlusion
baseline=4.18.0

# ---------------------------------------------------------------------------
# The second regression — 5.6.0, 1.15x, named from a diff and never measured.
#
# Item 40's adversarial pass found this step after the fact and attributed it to
# `ssao.frag`, whose per-sample bounds clamp became an `isOutsideBounds()` test
# with a `continue`. That attribution is a *reading*, and this project has a
# written rule about readings: the size of a diff carries no information about
# its cost. A static diff already said 5.0.0 once, and 5.0.0 is 1.03x.
#
# Four files change in the capture path between 5.5.0 and 5.6.0, not one:
#
#   ssao.frag      the per-sample bounds test, plus a new isBackground() guard
#                  on the opaque sample and a per-level divisor
#   ssao.js        the SSAO kernel is now blue-noise distributed, where it was
#                  256 Math.random() hemisphere vectors — a different sample
#                  distribution reaches different depth texels
#   outlines.frag  a new "lazy curvature veto", eight extra depth reads per pixel
#   canvas3d.js    the draw loop's fence-sync throttle removed
#
# `outline` defaults to 'off' and this benchmark does not turn it on, so the
# third is not exercised here — checked in that release's postprocessing params,
# not assumed. The other three are all live, and only one of them has been named.
#
# So: transplant the shader instead of arguing about it. Both directions, which
# is a double dissociation rather than a single elimination:
#
#   5.6.0 carrying 5.5.0's ssao.frag   -> if the step is GONE, nothing else in
#                                         the release contributes to it
#   5.5.0 carrying 5.6.0's ssao.frag   -> if the step APPEARS, that shader is
#                                         sufficient on its own
#
# Either result alone is worth having; the pair is what makes "it is this file"
# a measurement. If the step survives the revert, the answer is in `ssao.js`'s
# new sample distribution or `canvas3d.js`'s fence, and neither can be reached
# with a shader splice — that is the next instrument, not this one.
#
# Eight rows: every condition twice, the second four in reverse order, so that
# a runner drifting over the job cannot line its drift up with one condition.
# 5.5.0 measured first and last is this run's own noise floor — the same build
# twice, read off the same runner as the signal, which is what let item 40's
# 2.91x be believed.
#
# Two bundles are fetched, not eight; a transplant costs a string splice.
# ---------------------------------------------------------------------------

versions=5.5.0,5.6.0,5.6.0:ssao.frag=5.5.0,5.5.0:ssao.frag=5.6.0,5.5.0:ssao.frag=5.6.0,5.6.0:ssao.frag=5.5.0,5.6.0,5.5.0
levels=4,1
repeats=4
warmup=1
size=800x600
fullpath=0
baseline=5.5.0
