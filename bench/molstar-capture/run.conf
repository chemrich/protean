# What the next push to a `molstar-bench/**` branch will measure.
#
# This file is the run's parameters *and* its record: each measurement is a
# commit, so the table in the job summary can always be traced back to the
# settings that produced it. Workflow-dispatch inputs override everything here.
#
# ---------------------------------------------------------------------------
# Step 0 — the falsification gate. Do not bisect until this passes.
#
# 4.18.0 and 5.11.0, twice each, interleaved. Interleaved rather than grouped
# because a runner that drifts over a long job would otherwise put all of the
# drift into the second version and hand back a ratio that is half thermal.
#
# The gate has to show roughly the 2.08x the real job showed. If it does not,
# this benchmark is measuring the wrong thing and bisecting it would name a
# release for no reason.
#
# Two sample levels, because they answer different questions. A regression in
# the cost of each *sample* holds the same ratio at level 4 and level 1. A
# regression in fixed per-capture work — a pass rebuilt, a program relinked once
# per capture — is a roughly constant number of milliseconds, so its ratio falls
# as the level rises. Which one this is decides both where to look in Mol* and
# whether the nineteen-release sweep can be run at the cheap level.
# ---------------------------------------------------------------------------

versions=4.18.0,5.11.0,4.18.0,5.11.0
levels=4,1
repeats=6
warmup=2
size=800x600
fullpath=2
baseline=4.18.0
