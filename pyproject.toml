[project]
name = "protean-mcp"
version = "0.1.0.dev0"
description = "Agent-native molecular visualization: an MCP server driving a Mol* viewer"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression rather than a file reference, so the licence is
# machine-readable. The table form leaves `License` empty in installed
# metadata — an audit of the dependency tree read protean's own licence as
# UNSTATED, which is a poor look for the package doing the auditing.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charlie Emrich", email = "emrich@gmail.com" }]
keywords = ["mcp", "molstar", "pymol", "structural-biology", "visualization"]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "biotite>=1.6.0",
    "pdb2pqr>=3.7",
    # snapshot() writes TIFF and JPEG, and stamps the DPI into the file — none
    # of which Mol* can do. Promoted from the dev group by decision 11, in the
    # PR that first needs it at runtime.
    "pillow>=11.0",
    # The viewer-neutral cryo-EM views, shared with MCPymol. A view returns
    # (report, Scene) and never calls a viewer; `backends/` here lowers a
    # Scene onto Mol*. See github.com/chemrich/wiggles-em.
    "wiggles-em",
]

[project.urls]
Homepage = "https://github.com/chemrich/protean"
Repository = "https://github.com/chemrich/protean"
Changelog = "https://github.com/chemrich/protean/blob/main/CHANGELOG.md"

[project.scripts]
protean-mcp = "protean_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protean_mcp"]
# The built viewer is gitignored — it is an npm build artifact, not source —
# and hatchling honours VCS ignores when choosing files. Without this the wheel
# ships a server whose viewer never loads: `pip install` succeeds, open_viewer
# reports the app is not built, and nothing else says why.
artifacts = ["src/protean_mcp/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "RET",           # returns
    "PT",            # pytest style
    "ASYNC",         # async pitfalls
    "DTZ",           # naive datetimes
    "PL",            # pylint subset
    "RUF",
]
ignore = [
    # trio/anyio idioms; this project is plain asyncio, where an explicit
    # timeout parameter and synchronous reads of small local files are fine.
    "ASYNC109",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# The benchmark and corpus scripts are written the way someone probing the
# tool would write them, and are quoted in docs/. A long flat list of probes
# is what the corpus is meant to be; restructuring it into functions would
# hide the one thing it is for, which is being read straight through.
"docs/benchmark/*" = ["E501", "E702", "PLR2004", "T201", "INP001", "PLR0915", "PLR0912"]
# The figure script drives a real browser for the same reasons the differential
# harness does — blocking subprocess calls, a module-level handle on the
# debugging port, broad excepts that report a refusal rather than crashing a
# twenty-figure run — and its thresholds are one-off framing constants that
# naming would not clarify.
"docs/figures/*" = [
    "ASYNC220", "ASYNC221", "PLW1510", "PLW0603", "BLE001", "PLR2004",
    "PLC0415", "PLR0913", "PLR0917", "PLR0402", "T201", "INP001",
]
# A generator that prints what it wrote and imports nothing at runtime.
"docs/generate/*" = ["T201", "INP001"]
# The Mol* capture benchmark is a standalone harness, stdlib only, with no
# protean import anywhere in it — see bench/molstar-capture/README.md, and the
# reason it is standalone: it has to run against Mol* 4.18, which protean's own
# viewer cannot compile against. So it drives a browser and a socket the way
# tests/ does, prints its table to stdout because stdout is what a CI step
# summary reads, and turns a broken result file into a row rather than a
# traceback.
"bench/*" = [
    "PLW1510", "BLE001", "T201", "INP001", "PLR0912", "PLR0915", "PLR2004",
]
# The differential harness deliberately drives a real browser: blocking
# subprocess calls and broad excepts are the point, not an oversight.
"tests/*" = [
    "ASYNC220", "ASYNC221", "BLE001", "PLW1510", "PLR2004", "PT018",
    # Fixture builders take one argument per structural field on purpose.
    "PLR0913", "PLR0917",
]
# MCP tools deliberately expose flat keyword parameters: a model fills a flat
# tool schema far more reliably than a nested options object.
"src/protean_mcp/server.py" = ["PLR0913", "PLR0917"]
# Two structures x (text, format, chain) plus a limit; folding them into an
# options object would make every call site worse.
"src/protean_mcp/analysis/superposition.py" = ["PLR0913", "PLR0917"]
# The emitter dispatches on AST node type; branch and return counts are the
# shape of the problem, not complexity worth refactoring away.
"src/protean_mcp/selections.py" = ["PLR0911", "PLR0912"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# FastMCP's tool decorator carries no annotations, so every tool it wraps is
# reported as untyped. That is a property of the library, not of our code.
module = "protean_mcp.server"
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
# pdb2pqr ships no py.typed marker, so its API is untyped to mypy. We use it
# only through main_driver/build_main_parser and validate the PQR it writes.
module = ["pdb2pqr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# wiggles-em is fully annotated but ships no py.typed marker, so mypy will not
# read its types. This is an upstream one-line fix (a `py.typed` file plus the
# package-data entry); until it lands and the pin moves, its Scene vocabulary
# arrives here as Any. `backends/molstar.py` is written as though the types
# were visible, so nothing has to change when they become so.
module = ["wiggles_em.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test bodies stay unannotated; they are still type-checked internally.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# A pinned git dependency, not a path one. CI runs `uv sync` after
# `actions/checkout@v4`, which checks out protean and nothing else, so
# `../wiggles-em` exists on a laptop where both repos sit side by side and
# nowhere else. wiggles-em is public, so a git pin works without publishing
# either project to PyPI.
#
# To edit wiggles-em and see it here immediately, shadow the pin locally:
#
#     uv pip install -e ../wiggles-em
#     export UV_NO_SYNC=1
#
# Both lines, not just the first. `uv sync` reverts the editable install to the
# pinned revision — measured on uv 0.12.3, and it does so silently as a
# one-line "Uninstalled 1 package". `uv run` syncs first, so without
# UV_NO_SYNC every test run puts the pin back. A `uv.toml` override is not an
# alternative: uv rejects `sources` there outright.
#
# Bump `rev` when a wiggles-em change needs to reach CI or another clone.
[tool.uv.sources]
wiggles-em = { git = "https://github.com/chemrich/wiggles-em", rev = "df2252e" }
