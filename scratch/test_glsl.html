<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script type="module">
import { refraction_composite_frag } from '../viewer/src/refraction-shaders.ts';
const gl = document.getElementById('c').getContext('webgl');

const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, `
precision highp float;
void main() {
    gl_Position = vec4(0.0);
}
`);
gl.compileShader(vs);

const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, refraction_composite_frag.replace('#include common', ''));
gl.compileShader(fs);

if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    console.error("FRAG ERROR:", gl.getShaderInfoLog(fs));
} else {
    console.log("COMPILED FINE");
}
</script>
</body>
</html>
